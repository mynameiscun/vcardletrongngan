<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11126f">
    <meta name="description" content="Danh thiếp điện tử của Lê Trọng Ngân">

    <title>Lê Trọng Ngân | Danh thiếp điện tử</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <svg class="svg-icons" aria-hidden="true">
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path>
      </symbol>
      <symbol id="icon-qr" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <path d="M14 14h3v3h-3zM20 14v7M14 20h3"></path>
      </symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
      </symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="m3 7 9 6 9-6"></path>
      </symbol>
      <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
        <path d="M8 11h.01M12 11h.01M16 11h.01"></path>
      </symbol>
      <symbol id="icon-share" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"></path>
      </symbol>
      <symbol id="icon-mobile" viewBox="0 0 24 24">
        <rect x="6" y="2" width="12" height="20" rx="2"></rect>
        <path d="M10 18h4"></path>
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="12" height="12" rx="2"></rect>
        <path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"></path>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6"></path>
      </symbol>
      <symbol id="icon-user-plus" viewBox="0 0 24 24">
        <path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8"></path>
        <path d="M19 8v6M22 11h-6"></path>
      </symbol>
      <symbol id="icon-users" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </symbol>
    </svg>

    <main class="profile-shell">
      <article class="profile-card" aria-label="Danh thiếp điện tử Lê Trọng Ngân">
        <div class="card-glow glow-one"></div>
        <div class="card-glow glow-two"></div>

        <header class="card-header">
          <button id="languageButton" class="glass-button language-button" type="button" aria-label="Chuyển sang tiếng Anh">
            <svg><use href="#icon-globe"></use></svg>
            <span id="langVi" class="active">VIE</span>
            <span class="language-divider">/</span>
            <span id="langEn">ENG</span>
          </button>

          <button id="openQrButton" class="glass-button qr-button" type="button" aria-label="Mở mã QR vCard">
            <svg><use href="#icon-qr"></use></svg>
          </button>
        </header>

        <section class="identity-section">
          <div class="avatar" aria-label="Ảnh đại diện Lê Trọng Ngân">
            <img id="avatarImage" src="" alt="Lê Trọng Ngân" hidden>
            <span id="avatarInitials">LTN</span>
          </div>
          <p class="role" data-i18n="role">GIÁM ĐỐC</p>
          <h1>LÊ TRỌNG NGÂN</h1>
          <div class="name-accent"></div>
        </section>

        <nav class="quick-actions" aria-label="Liên hệ nhanh">
          <a id="callAction" class="quick-action" href="tel:0772771675">
            <span class="action-icon"><svg><use href="#icon-phone"></use></svg></span>
            <span data-i18n="call">Gọi</span>
          </a>

          <a id="emailAction" class="quick-action" href="mailto:trongngan@gmail.com">
            <span class="action-icon"><svg><use href="#icon-mail"></use></svg></span>
            <span data-i18n="email">Email</span>
          </a>

          <a id="zaloAction" class="quick-action" href="https://zalo.me/0772771675" target="_blank" rel="noreferrer">
            <span class="action-icon"><svg><use href="#icon-message"></use></svg></span>
            <span>Zalo</span>
          </a>

          <button id="shareButton" class="quick-action" type="button">
            <span class="action-icon"><svg><use href="#icon-share"></use></svg></span>
            <span data-i18n="share">Chia sẻ</span>
          </button>
        </nav>

        <section class="contact-sheet">
          <div class="contact-list">
            <div class="contact-row">
              <span class="contact-icon"><svg><use href="#icon-mobile"></use></svg></span>
              <a id="phoneLink" class="contact-value" href="tel:0772771675">
                <span data-i18n="phoneLabel">Số điện thoại</span>
                <strong id="phoneText">0772 771 675</strong>
              </a>
              <button class="copy-button" type="button" data-copy="phone" aria-label="Sao chép số điện thoại">
                <svg><use href="#icon-copy"></use></svg>
              </button>
            </div>

            <div class="contact-row">
              <span class="contact-icon"><svg><use href="#icon-mail"></use></svg></span>
              <a id="emailLink" class="contact-value" href="mailto:trongngan@gmail.com">
                <span data-i18n="emailLabel">Địa chỉ email</span>
                <strong id="emailText">trongngan@gmail.com</strong>
              </a>
              <button class="copy-button" type="button" data-copy="email" aria-label="Sao chép địa chỉ email">
                <svg><use href="#icon-copy"></use></svg>
              </button>
            </div>

            <button id="websiteButton" class="contact-row unavailable-row" type="button">
              <span class="contact-icon"><svg><use href="#icon-globe"></use></svg></span>
              <span class="contact-value">
                <span data-i18n="websiteLabel">Website</span>
                <strong id="websiteText" data-i18n="updating">Đang cập nhật</strong>
              </span>
            </button>
          </div>

          <a id="saveContactButton" class="save-contact" href="contact.vcf" download="Le-Trong-Ngan.vcf">
            <svg><use href="#icon-user-plus"></use></svg>
            <span data-i18n="addContact">Thêm vào danh bạ</span>
          </a>

          <div class="social-section">
            <h2 data-i18n="connect">Kết nối với tôi</h2>
            <div class="social-grid">
              <a id="zaloSocial" class="social-link zalo-link" href="https://zalo.me/0772771675" target="_blank" rel="noreferrer">
                <svg><use href="#icon-message"></use></svg>
                Zalo
              </a>
              <button id="facebookButton" class="social-link facebook-link" type="button">
                <svg><use href="#icon-users"></use></svg>
                Facebook
              </button>
            </div>
          </div>
        </section>
      </article>
    </main>

    <div id="qrModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>

      <section class="qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle" aria-describedby="qrDescription">
        <header class="qr-dialog-header">
          <h2 id="qrTitle">
            <svg><use href="#icon-qr"></use></svg>
            <span data-i18n="qrTitle">MÃ QR VCARD</span>
          </h2>
          <button id="closeQrButton" class="close-button" type="button" aria-label="Đóng">
            <svg><use href="#icon-close"></use></svg>
          </button>
        </header>

        <div class="qr-frame">
          <div id="qrCode"></div>
          <div class="qr-logo" aria-hidden="true">
            <strong>LTN</strong>
            <small>VCARD</small>
          </div>
        </div>

        <p id="qrDescription" class="qr-description" data-i18n="qrDescription">
          Đưa camera điện thoại lên để quét trực tiếp danh thiếp này.
        </p>

        <button id="downloadQrButton" class="download-qr" type="button">
          <svg><use href="#icon-download"></use></svg>
          <span data-i18n="downloadQr">Tải ảnh QR </span>
        </button>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="vendor/qrcode.js"></script>
    <script src="vendor/qrcode_UTF8.js"></script>
    <script src="script.js"></script>
  </body>
</html>
